name: Command and documentation gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: CLI, project configuration and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Detect obsolete commands and documentation drift
        run: |
          python tests/lepus_cli_contract.py
          python tests/lepus_doc_history.py
      - name: Verify generated API references are synchronized
        run: |
          python tools/library_reference.py --check
          python tools/check_std_naming.py
      - name: Check keyword consistency
        run: |
          python tools/check_keywords.py
          python tests/test_check_keywords.py
      - name: Check changelog consistency
        run: python tools/changelog.py --check
      - name: Validate benchmark report completeness and checksums
        run: python tests/lepus_benchmark_report.py
      - name: Check the pinned HareParse download
        run: python tests/gen_download.py
      - name: Validate the translation catalog and generate embedded translations
        run: python tools/embed_i18n.py
      - name: Exercise actual argument normalization
        run: |
          mkdir -p tmp
          g++ -std=c++17 -Wall -Wextra -Werror tests/lepus_cli_test.cpp -o tmp/lepus-cli-test
          tmp/lepus-cli-test
      - name: Check editor build configuration and project integration
        working-directory: vscode
        run: |
          node test/llvmConfiguration.js
          node test/editorIntegration.js
      - name: Check generated sources for whitespace errors
        run: git show --format= --check HEAD
